  td.fhit, span.fhit { background:var(--dk-status-bad-bg) !important; color:var(--dk-status-bad); font-weight:700; } th.fcol, td.fcol, span.fcol { background:var(--dk-status-amber-bg); }
  tr.frow td:first-child { box-shadow:inset 3px 0 0 var(--dk-status-bad-dot); }

  .chart-alert { box-shadow:inset 0 0 0 2px var(--dk-status-bad-dot), var(--dk-shadow-ambient) !important; }
  .noteitem { background:var(--dk-surface-container-low); border-radius:6px; padding:10px 12px; margin:8px 0; font-size:13px; line-height:18px; }

  .chart svg[data-chart] { width:100%; height:auto; display:block; } .chart .lg svg { display:inline-block; vertical-align:middle; } .chart svg text { fill:var(--dk-on-surface-subtle); font-family:var(--dk-font-body); }
  .tip { position:fixed; pointer-events:none; background:var(--dk-on-surface); color:var(--dk-surface-container-lowest); font-size:13px; line-height:20px; padding:8px 10px; border-radius:8px; z-index:50; box-shadow:var(--dk-shadow-floating); font-variant-numeric:tabular-nums; }

  /* ---- chat ---- */
  .chat { position:fixed; top:0; right:0; bottom:0; width:var(--chat); background:var(--dk-surface-container-lowest); box-shadow:var(--dk-shadow-ambient); display:flex; flex-direction:column; z-index:25; }
  .chat[hidden] { display:none; }

  .m.u { align-self:flex-end; background:var(--dk-surface-container-highest); padding:8px 12px; border-radius:8px; max-width:88%; }
  .m.a { background:var(--dk-surface-container-low); padding:10px 12px; border-radius:8px; font-size:13px; line-height:20px; }
  .m.a ul { margin:4px 0; padding-left:18px; } .m.a p { margin:0 0 6px; }
  .cite { display:inline-flex; font:600 11px/16px var(--dk-font-body); color:var(--dk-primary); background:var(--dk-surface-container-lowest); border-radius:4px; padding:0 5px; cursor:pointer; margin:0 1px; vertical-align:1px; box-shadow:inset 0 0 0 1px var(--dk-ghost-border); }
  .cite:hover { background:var(--dk-surface-container-high); }
  mark.no_source, mark.unknown_citation { background:var(--dk-status-bad-bg); color:var(--dk-status-bad); } mark.number_mismatch { background:var(--dk-status-amber-bg); color:var(--dk-status-amber); }
  .verdict { margin-top:8px; font-size:12px; line-height:16px; padding:6px 10px; border-radius:6px; display:flex; gap:6px; align-items:flex-start; }
  .verdict.ok { background:var(--dk-status-ok-bg); color:var(--dk-status-ok); } .verdict.bad { background:var(--dk-status-amber-bg); color:var(--dk-status-amber); } .verdict.none { background:var(--dk-status-bad-bg); color:var(--dk-status-bad); }

  .trace { font-size:12px; line-height:16px; color:var(--dk-on-surface-subtle); margin-top:6px; }
  .compose { border-top:1px solid var(--dk-ghost-border); padding:12px; display:flex; gap:8px; }

  .sugg { display:flex; flex-wrap:wrap; gap:6px; }

  /* ---- rules editor ---- */
  .rule { display:grid; grid-template-columns:auto 1fr auto; gap:6px 14px; padding:14px 20px; border-bottom:1px solid var(--dk-ghost-border); align-items:start; }

  .crow { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto; gap:8px; margin-bottom:6px; }
  .preview { background:var(--dk-surface-container-low); border-radius:6px; padding:12px 14px; margin-top:14px; font-size:13px; line-height:18px; }
  .errs { color:var(--dk-status-bad); font-size:13px; margin-top:8px; }
  .frm { display:grid; grid-template-columns:1fr 1fr; gap:4px 16px; } .frm .full { grid-column:1 / 3; }
  .filt { display:inline-flex; gap:6px; flex-wrap:wrap; }

  .filt button.on { background:var(--dk-surface-container-highest); color:var(--dk-on-surface); font-weight:600; }
  .secgrid { display:grid; grid-template-columns:1fr 1fr; gap:16px; } .secgrid .card { padding:0 0 6px; overflow:hidden; }
  .secgrid .card h4 { margin:0; padding:16px 20px 8px; font:700 16px/22px var(--dk-font-display); display:flex; gap:8px; align-items:baseline; }
  .secgrid .tw { box-shadow:none; }

  /* ---- toasts, skeleton, error ---- */
  .toast { position:fixed; right:24px; bottom:24px; z-index:9999; display:inline-flex; align-items:center; gap:10px; min-width:260px; max-width:420px; padding:10px 14px; border-radius:8px;
    background:var(--dk-surface-container-lowest); color:var(--dk-on-surface); box-shadow:var(--dk-shadow-floating); font-size:13px; line-height:18px; border-left:3px solid var(--dk-status-ok); animation:tin 140ms ease-out; }
  .toast.err { border-left-color:var(--dk-status-bad); }
  body.chat-open .toast { right:calc(var(--chat) + 24px); }
  @keyframes tin { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .skel { display:block; background:var(--dk-surface-container); border-radius:6px; }
  .errcard { background:var(--dk-status-bad-bg); color:var(--dk-status-bad); border-radius:8px; padding:24px; display:grid; gap:10px; }
  .errcard b { font:700 18px/24px var(--dk-font-display); }
  .dots::after { content:"..."; }
  @media (max-width: 1279px) { .kpis, .kpis.six { grid-template-columns:repeat(3, minmax(0,1fr)); } }
  @media (max-width: 1100px) { body.chat-open { padding-right:0; } .charts, .secgrid { grid-template-columns:1fr; } .crow { grid-template-columns:1fr 1fr; } }
  @media (max-width: 767px) { .dk-page { padding:16px 16px 80px; } .kpis, .kpis.six { grid-template-columns:repeat(2, minmax(0,1fr)); } .frm { grid-template-columns:1fr; } .frm .full { grid-column:1; } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }


  /* ---- alerts (Greg) ---- */
  .simbar { display:flex; align-items:center; gap:10px; background:var(--dk-status-warn-bg); color:var(--dk-on-surface); border-radius:8px; padding:10px 14px; margin:14px 0 0; font-size:13px; }
  .simbar .ico { color:var(--dk-status-warn); }
  .flow { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:10px; font-size:12px; }
  .flow span { background:var(--dk-surface-container); border-radius:999px; padding:3px 10px; color:var(--dk-on-surface); } .flow .ico { color:var(--dk-on-surface-muted); }
  .agentsteps { list-style:none; margin:0; padding:0; font-size:13px; } .agentsteps li { display:flex; gap:8px; padding:4px 0; align-items:flex-start; }
  .agentsteps .who { font-weight:600; min-width:64px; } .agentsteps .iss { color:var(--dk-on-surface-muted); font-size:12px; }
  .msgtabs { display:flex; gap:6px; margin:6px 0 8px; } .msgtabs button { border:0; background:var(--dk-surface-container); border-radius:999px; padding:4px 12px; font:500 13px/18px var(--dk-font-body); color:var(--dk-on-surface-muted); }
  .msgtabs button.on { background:var(--dk-surface-container-highest); color:var(--dk-on-surface); font-weight:600; }
  .alertgrid { display:grid; grid-template-columns:1.5fr 1fr; gap:20px; } .alertgrid textarea { width:100%; min-height:240px; font:13px/19px var(--dk-font-body); }
  .alertgrid input.subj { width:100%; font-weight:600; margin-bottom:6px; } .addr { font-size:12px; color:var(--dk-on-surface-muted); margin-bottom:6px; }
  .checks { list-style:none; margin:0; padding:0; font-size:12px; line-height:17px; } .checks li { display:flex; gap:6px; padding:3px 0; }
  .checks .ok { color:var(--dk-status-ok); } .checks .bad { color:var(--dk-status-bad); }
  .working { display:flex; align-items:center; gap:10px; padding:30px 0; font-size:14px; }
  /* ---- well report ---- */
  .repcards { display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  .repcard { display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border-radius:8px; background:var(--dk-surface-container-lowest); box-shadow:var(--dk-shadow-ambient); color:var(--dk-on-surface); text-decoration:none; font-size:12px; line-height:16px; }
  .repcard:hover { background:var(--dk-surface-container-low); } .repcard > .ico:first-child { color:var(--dk-primary); flex:none; margin-top:1px; } .repcard > .ico:last-child { margin-left:auto; flex:none; color:var(--dk-on-surface-muted); }
  body.report-mode header.dk-top, body.report-mode #fresh, body.report-mode #chat, body.report-mode #nav, body.report-mode .dk-page-head { display:none !important; }
  body.report-mode .dk-page { max-width:960px; margin:0 auto; padding-top:24px; }
  .report section { margin:22px 0; } .report h2 { font:700 16px/22px var(--dk-font-display); margin:0 0 10px; color:var(--dk-on-surface); }
  .report h1 { font:700 28px/34px var(--dk-font-display); margin:6px 0 4px; } .report .eyebrow { font:600 12px/16px var(--dk-font-body); color:var(--dk-on-surface-muted); }
  .report .rhead { margin-bottom:16px; } .report .rtools { display:flex; gap:8px; justify-content:flex-end; }
  .report .two { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .report table.kv th { width:42%; background:none; position:static; color:var(--dk-on-surface-muted); font-weight:500; } .report table.kv tr.hit td, .report table.kv tr.hit th { color:var(--dk-status-bad); }
  .report table th { position:static; }
  .report .rq { font-weight:600; margin-bottom:6px; } .report .ra { background:var(--dk-surface-container-low); border-radius:8px; padding:10px 14px; font-size:13px; line-height:19px; } .report .ra p { margin:4px 0; }
  .report .rsrc { margin:6px 0; padding-left:18px; font-size:13px; line-height:22px; } .report .rsrc a { color:var(--dk-on-surface); }
  .report footer { margin:28px 0 12px; border-top:1px solid var(--dk-ghost-border); padding-top:10px; }
  @media print {
    @page { margin:14mm; }
    body { background:#fff !important; } .noprint, #tip, #toast { display:none !important; }
    body.report-mode .dk-page { max-width:none; padding:0; }
    .report section, .report .chart, .report tr { break-inside:avoid; } .report .charts { grid-template-columns:1fr 1fr; }
    .report .kpi, .report .whybox, .report .chart { box-shadow:none; border:1px solid #ddd; }
    .report a { color:inherit; text-decoration:none; }
  }
</style>

<body>
<header class="dk-top">
  <div class="dk-brand">
    <span class="dk-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M8 21h8"/><path d="M5 10l7-7 7 7"/><circle cx="12" cy="13" r="2.2" fill="#f16823" stroke="#f16823"/></svg></span>
    <div><div class="dk-brand-name">Well Watch</div><div class="dk-brand-ws">Ridgeline Resources · Production engineering</div></div>
    <span class="pill warn" style="margin-left:8px" title="All wells, engineers and readings are made up for this demo.">Synthetic data</span>
  </div>
  <div class="dk-top-tools">
    <label class="muted" for="eng" style="font-size:13px">Engineer</label><select id="eng" style="min-height:36px"></select>
    <button class="dk-icon-btn" id="themebtn" title="Switch light or dark theme" aria-label="Switch light or dark theme"></button>
    <button class="btn" id="chatbtn">Ask the data</button>
  </div>
</header>
<div id="fresh" class="freshbar"></div>
<div class="dk-page">
  <div class="dk-page-head"><div><h1 class="dk-page-title" id="ptitle">My day</h1><div class="dk-page-meta" id="pmeta"></div></div></div>
  <nav id="nav" role="tablist">
    <button data-v="day" class="on" role="tab">My day <span class="count" id="c-day"></span></button>
    <button data-v="wells" role="tab">My wells <span class="count" id="c-wells"></span></button>
    <button data-v="safety" role="tab">Safety <span class="count" id="c-safety"></span></button>
    <button data-v="alerts" role="tab">Alerts <span class="count" id="c-alerts"></span></button>
    <button data-v="rules" role="tab">Flag rules <span class="count" id="c-rules"></span></button>
  </nav>
  <main id="main"><div class="kpis six"><div class="kpi"><span class="skel" style="height:28px;width:60%"></span><span class="skel" style="height:14px;width:80%;margin-bottom:6px"></span></div><div class="kpi"><span class="skel" style="height:28px;width:60%"></span><span class="skel" style="height:14px;width:80%;margin-bottom:6px"></span></div><div class="kpi"><span class="skel" style="height:28px;width:60%"></span><span class="skel" style="height:14px;width:80%;margin-bottom:6px"></span></div><div class="kpi"><span class="skel" style="height:28px;width:60%"></span><span class="skel" style="height:14px;width:80%;margin-bottom:6px"></span></div><div class="kpi"><span class="skel" style="height:28px;width:60%"></span><span class="skel" style="height:14px;width:80%;margin-bottom:6px"></span></div><div class="kpi"><span class="skel" style="height:28px;width:60%"></span><span class="skel" style="height:14px;width:80%;margin-bottom:6px"></span></div></div><div class="card" style="padding:20px"><span class="skel" style="height:16px;width:70%;margin:12px 0"></span><span class="skel" style="height:16px;width:55%;margin:12px 0"></span><span class="skel" style="height:16px;width:80%;margin:12px 0"></span><span class="skel" style="height:16px;width:60%;margin:12px 0"></span><span class="skel" style="height:16px;width:75%;margin:12px 0"></span><span class="skel" style="height:16px;width:50%;margin:12px 0"></span></div></main>
</div>
<aside class="drawer" id="drawer" hidden><div class="dhead" id="dhead"></div><div class="dbody" id="dbody"></div></aside>
<aside class="chat" id="chat" hidden>
  <div class="ch"><b>Ask the data</b><span class="muted small" id="chatmodel"></span>
    <button class="btn sec small" id="chatnew" style="margin-left:auto">New chat</button><button class="dk-icon-btn" id="chatx" aria-label="Close the assistant" title="Close"><svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="msgs" id="msgs"></div>
  <div class="compose"><textarea id="q" placeholder="Ask about your wells… (Enter to send)"></textarea><button class="btn" id="send">Send</button></div>
</aside>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div class="modal" id="editor" hidden><div class="card" style="width:min(860px,100%);max-height:94vh;overflow:auto" id="edbox"></div></div>
<div class="tip" id="tip" hidden></div>

<script src="flags.js"></script>
<script src="app.js"></script>
</body>
</html>
